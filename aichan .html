<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あいちゃん 三択物語</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  background: #faf9f5;
  color: #2c2c2a;
  min-height: 100vh;
  padding: 1.5rem 1rem;
}
#app { max-width: 560px; margin: 0 auto; }

/* ========== 進捗ドット ========== */
.prog {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 1.5rem;
  align-items: center;
}
.dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: #ccc;
}
.dot.done { background: #534AB7; }
.dot.now  { background: #534AB7; box-shadow: 0 0 0 3px #dddafc; }

/* ========== 物語テキスト ========== */
.story-box {
  background: #f0ede4;
  border: 1px solid #c8c5bc;
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  font-size: 16px;
  line-height: 2.0;
  white-space: pre-line;
  margin-bottom: 1.25rem;
  min-height: 100px;
}

/* ========== 質問文 ========== */
.question {
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 1.25rem;
  padding: 0 .5rem;
  line-height: 1.6;
}

/* ========== 選択カード ========== */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 1.25rem;
}
.card {
  background: #fff;
  border: 2px solid #ccc;
  border-radius: 12px;
  padding: 1.25rem 1rem;
  cursor: pointer;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: border-color .2s, background .2s;
  user-select: none;
}
.card:hover { border-color: #888; background: #f8f7f3; }
.card.selected { border: 3px solid #534AB7; background: #eeedfe; }
.card-letter {
  font-size: 30px;
  font-weight: 800;
  color: #999;
  margin-bottom: 8px;
  transition: color .2s;
}
.card.selected .card-letter { color: #534AB7; }
.card-hint { font-size: 13px; color: #bbb; }
.card-text {
  display: none;
  font-size: 14px;
  line-height: 1.6;
  color: #333;
}
.card.selected .card-text { color: #3c3489; }
.card.opened .card-hint { display: none; }
.card.opened .card-text { display: block; }
.card.opened .card-letter { font-size: 15px; margin-bottom: 8px; color: #888; }

/* ========== 決定ボタン ========== */
.ok-btn {
  display: none;
  width: 100%;
  padding: 14px;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: all .2s;
  margin-bottom: .5rem;
}
.ok-btn:hover { background: #f0ede4; border-color: #888; }
.ok-btn:active { transform: scale(.98); }
.shuffle-note { font-size: 12px; color: #bbb; text-align: center; }

/* ========== 結果画面 ========== */
.result-wrap {
  text-align: center;
  padding: 2.5rem 1rem;
  animation: pop .4s ease;
}
.result-emoji { font-size: 72px; line-height: 1; margin-bottom: 1.25rem; }
.result-label { font-size: 15px; color: #666; margin-bottom: .5rem; }
.result-title { font-size: 34px; font-weight: 800; margin-bottom: .5rem; color: #2c2c2a; }
.result-laugh { font-size: 18px; color: #534AB7; font-weight: 700; margin-bottom: .75rem; }
.result-path {
  font-size: 13px;
  color: #888;
  background: #f0ede4;
  border-radius: 8px;
  padding: .75rem 1rem;
  margin-bottom: 2rem;
  line-height: 1.8;
  text-align: left;
}
.chat-start-btn {
  padding: 16px 44px;
  border: none;
  border-radius: 10px;
  background: #534AB7;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.chat-start-btn:hover { background: #3c3489; }
.chat-start-btn:active { transform: scale(.98); }

/* ========== チャット画面 ========== */
.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: .75rem 0 1rem;
  border-bottom: 2px solid #e0ddd6;
  margin-bottom: 1rem;
}
.chat-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #eeedfe;
  border: 2px solid #afa9ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.chat-header-info h3 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
.chat-header-info p  { font-size: 13px; color: #666; }

.messages {
  height: 380px;
  overflow-y: auto;
  padding: .5rem 0;
  margin-bottom: 1rem;
}
/* AIメッセージ */
.msg-ai {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
  animation: fadeup .3s ease;
}
.msg-ai-av {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #eeedfe;
  border: 1px solid #afa9ec;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.msg-ai-bubble {
  background: #f0ede4;
  border: 1px solid #c8c5bc;
  border-radius: 0 12px 12px 12px;
  padding: 11px 15px;
  max-width: 85%;
  font-size: 16px;
  line-height: 1.8;
  white-space: pre-line;
}
.msg-ai.loading .msg-ai-bubble { color: #bbb; }
/* ユーザーメッセージ */
.msg-user {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
  animation: fadeup .3s ease;
}
.msg-user-bubble {
  background: #eeedfe;
  border: 1px solid #afa9ec;
  border-radius: 12px 0 12px 12px;
  padding: 11px 15px;
  max-width: 85%;
  font-size: 16px;
  line-height: 1.8;
  color: #26215c;
  white-space: pre-line;
}

/* 入力エリア */
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-box {
  flex: 1;
  padding: 12px 15px;
  border: 2px solid #ccc;
  border-radius: 10px;
  font-family: inherit;
  font-size: 16px;
  resize: none;
  min-height: 50px;
  max-height: 120px;
  line-height: 1.5;
  background: #fff;
}
.input-box:focus { outline: none; border-color: #534AB7; }
.send-btn {
  padding: 0 22px;
  height: 50px;
  border: none;
  border-radius: 10px;
  background: #534AB7;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
  white-space: nowrap;
}
.send-btn:hover { background: #3c3489; }
.send-btn:disabled { background: #ccc; cursor: not-allowed; }

.mic-btn {
  padding: 0 16px;
  height: 50px;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: #fff;
  font-size: 22px;
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.mic-btn:hover { border-color: #888; background: #f0ede4; }
.mic-btn.recording {
  background: #fee;
  border-color: #e24b4a;
  animation: pulse 1s infinite;
}
.mic-btn:disabled { opacity: .4; cursor: not-allowed; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(226,75,74,.4); }
  50%      { box-shadow: 0 0 0 6px rgba(226,75,74,0); }
}

.restart-link {
  font-size: 13px;
  color: #bbb;
  text-align: center;
  margin-top: 1rem;
  cursor: pointer;
  text-decoration: underline;
}

@keyframes pop { from { opacity:0; transform:scale(.95); } to { opacity:1; transform:scale(1); } }
@keyframes fadeup { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- パスワード画面 -->
<div id="pw-screen" style="max-width:400px;margin:5rem auto;padding:2rem;text-align:center;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;">
  <div style="font-size:60px;margin-bottom:1rem;">🌸</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:.5rem;color:#2c2c2a;">あいちゃん</h2>
  <p style="font-size:14px;color:#888;margin-bottom:1.5rem;">パスワードを入力してください</p>
  <input type="password" id="pw-input"
    placeholder="パスワード"
    style="width:100%;padding:13px 15px;border:2px solid #ccc;border-radius:8px;
           font-size:16px;margin-bottom:1rem;box-sizing:border-box;text-align:center;
           font-family:inherit;"
    onkeydown="if(event.key==='Enter')checkPassword()">
  <button onclick="checkPassword()"
    style="width:100%;padding:14px;border:none;border-radius:8px;background:#534AB7;
           color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;">
    入る →
  </button>
  <p id="pw-error" style="color:#e24b4a;font-size:13px;margin-top:.75rem;min-height:1.2em;"></p>
</div>

<div id="app" style="display:none">

  <!-- ゲーム画面 -->
  <div id="ph-game">
    <div class="prog">
      <div class="dot now" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div class="story-box" id="story-text">　</div>
    <div class="question" id="question-text"></div>
    <div class="cards">
      <div class="card" id="cardA" onclick="flipCard('A')">
        <div class="card-letter">Ａ</div>
        <div class="card-hint">タップして開く</div>
        <div class="card-text" id="textA"></div>
      </div>
      <div class="card" id="cardB" onclick="flipCard('B')">
        <div class="card-letter">Ｂ</div>
        <div class="card-hint">タップして開く</div>
        <div class="card-text" id="textB"></div>
      </div>
    </div>
    <button class="ok-btn" id="ok-btn" onclick="confirmChoice()"></button>
    <div class="shuffle-note">※ A・Bの内容は毎回ランダムに入れ替わります</div>
  </div>

  <!-- 結果画面 -->
  <div id="ph-result" style="display:none">
    <div class="result-wrap">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-label">今日のあなたは……</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-laugh">でした！　わははは！</div>
      <div class="result-path" id="result-path"></div>
      <button class="chat-start-btn" onclick="startChat()">あいちゃんと話す →</button>
    </div>
  </div>

  <!-- チャット画面 -->
  <div id="ph-chat" style="display:none">
    <div class="chat-header">
      <div class="chat-avatar">🌸</div>
      <div class="chat-header-info">
        <h3>あいちゃん</h3>
        <p id="chat-job-label"></p>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="マイクで話す">🎤</button>
      <textarea class="input-box" id="user-input" placeholder="ここに入力 または 🎤 を押して話す…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">送る</button>
    </div>
    <div id="mic-status" style="font-size:13px;color:#e24b4a;text-align:center;margin-top:.4rem;min-height:1.2em;"></div>
    <div class="restart-link" onclick="restart()">最初からやり直す</div>
    <div style="text-align:center;margin-top:1rem;">
      <button id="end-btn" onclick="endChat()"
        style="padding:12px 32px;border:2px solid #e24b4a;border-radius:8px;
               background:#fff;color:#e24b4a;font-size:15px;font-weight:700;
               cursor:pointer;font-family:inherit;transition:all .2s;">
        会話を終わりにする
      </button>
    </div>

    <!-- 終了・記録画面 -->
    <div id="end-screen" style="display:none;margin-top:1.5rem;animation:fadeup .4s ease;">
      <div style="text-align:center;padding:1.5rem 0 1rem;">
        <div style="font-size:40px;margin-bottom:.5rem;">🌸</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:.25rem;">今日もありがとうございました</div>
        <div style="font-size:14px;color:#888;">またいつでも話しかけてくださいね</div>
      </div>
      <div style="background:#f0ede4;border:1px solid #c8c5bc;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;">
        <div style="font-size:13px;font-weight:700;color:#534AB7;margin-bottom:.75rem;">📋 ナース用 観察メモ</div>
        <div id="nurse-memo" style="font-size:14px;line-height:1.9;color:#333;white-space:pre-line;">生成中…</div>
      </div>

      <!-- 要約ボタン＆表示 -->
      <button onclick="generateSummary()"
        id="summary-btn"
        style="width:100%;padding:13px;border:2px solid #534AB7;border-radius:8px;
               background:#fff;color:#534AB7;font-size:15px;font-weight:700;
               cursor:pointer;font-family:inherit;margin-bottom:.75rem;transition:all .2s;">
        📝 今日の要約（3行）を見る
      </button>
      <div id="summary-box" style="display:none;background:#fff;border:2px solid #534AB7;
           border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;animation:fadeup .4s;">
        <div style="font-size:13px;font-weight:700;color:#534AB7;margin-bottom:.75rem;">📝 今日の要約</div>
        <div id="summary-text" style="font-size:15px;line-height:2.0;color:#2c2c2a;white-space:pre-line;"></div>
      </div>
      <div id="save-status" style="text-align:center;font-size:14px;color:#888;margin-bottom:.75rem;min-height:1.5em;"></div>
      <button onclick="saveLog()"
        style="width:100%;padding:13px;border:none;border-radius:8px;background:#534AB7;
               color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
               margin-bottom:.75rem;" id="save-btn">
        📁 記録ファイルに保存
      </button>
      <div style="font-size:12px;color:#bbb;text-align:center;margin-bottom:.75rem;">
        初回のみファイルを選択します。2回目以降は自動で追記されます。
      </div>
      <div class="restart-link" onclick="restart()">最初からやり直す</div>
    </div>

</div>

<!-- APIキー入力画面（初回のみ） -->
<div id="key-screen" style="max-width:480px;margin:4rem auto;padding:2rem;text-align:center;">
  <div style="font-size:56px;margin-bottom:1rem;">🌸</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:.75rem;">あいちゃん 三択物語</h2>
  <p style="font-size:15px;color:#666;line-height:1.8;margin-bottom:1.5rem;">
    最初にAPIキーを入力してください。<br>
    次回からは自動で起動します。
  </p>
  <input type="text" id="key-input"
    placeholder="sk-... または sk-proj-..."
    style="width:100%;padding:12px 14px;border:2px solid #ccc;border-radius:8px;
           font-size:15px;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;">
  <button onclick="onSaveKey()"
    style="width:100%;padding:14px;border:none;border-radius:8px;background:#534AB7;
           color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;">
    保存して開始 →
  </button>
  <p id="key-error" style="color:#e24b4a;font-size:13px;margin-top:.75rem;"></p>
</div>

<script>
/* =====================================================
   物語ツリー
   ・nextが'result'なら職業発表へ
   ・optionsの順番は毎回ランダムにA/Bに割り当てる
   ===================================================== */
const TREE = {

  q1: {
    story: '昔々あるところに、おじいさんとおばあさんが\n仲良く暮らしていました。\n\nある朝、二人はそれぞれ用事に出かけることになりました——',
    q: 'さて、あなたはどちら？',
    opts: [
      { t: 'おじいさん', next: 'q2a' },
      { t: 'おばあさん', next: 'q2b' }
    ]
  },

  /* ── おじいさんルート ── */
  q2a: {
    story: 'おじいさんは山へ枯れ木拾いに出かけました。\n深い森の奥で、何やら不思議なものを見つけました——',
    q: 'おじいさんが見つけたのは？',
    opts: [
      { t: '🎋 光る竹（竹取物語の世界へ）',         next: 'q3_kaguya' },
      { t: '🌸 不思議な犬と枯れ木（花咲爺さんの世界へ）', next: 'q3_hana'   }
    ]
  },

  /* 竹取物語 */
  q3_kaguya: {
    story: '竹を割ると、中から光り輝く小さな女の子が！\n「かぐや姫」と名付けて大切に育てました。\n\nやがて世にも美しい娘に成長し、\n帝をはじめ多くの方が求婚に来ました——',
    q: '帝の求婚に、あなたはどうした？',
    opts: [
      { t: '「娘は誰にも渡せません！」と断り続けた', next: 'q4_kaguya_a' },
      { t: 'かぐや姫の判断にすべて任せた',           next: 'q4_kaguya_b' }
    ]
  },
  q4_kaguya_a: {
    story: '断り続けていたら、ついに帝が激怒。\n大軍が屋敷を包囲してしまいました！',
    q: 'さあ、あなたはどうした？',
    opts: [
      { t: '土下座してひたすら謝り倒した', next: 'result' },
      { t: '裏口からこっそり逃げ出した',   next: 'result' }
    ]
  },
  q4_kaguya_b: {
    story: 'ある満月の夜、かぐや姫が泣きながら言いました。\n「私は月の世界の者です。もう帰らなければなりません」\n\n天の羽衣を手にした天人たちが降りてきました——',
    q: 'あなたはどうした？',
    opts: [
      { t: '「行かないで！」と必死に引き止めた', next: 'result' },
      { t: '涙をこらえて静かに見送った',           next: 'result' }
    ]
  },

  /* 花咲爺さん */
  q3_hana: {
    story: '飼い犬がある場所でクンクンと鳴き、\n前足で盛んに地面を掘ろうとしています。\n「ここここここ！」と言いたそうです——',
    q: 'あなたはどうした？',
    opts: [
      { t: '犬と一緒に掘ってみた',    next: 'q4_hana_a' },
      { t: '手を合わせてその場で祈った', next: 'q4_hana_b' }
    ]
  },
  q4_hana_a: {
    story: '掘ってみると大判小判がザックザク！\n大喜びしていると、隣のじいさんが\n「私にも教えてくれ！」とやってきました——',
    q: 'あなたはどうした？',
    opts: [
      { t: '親切に場所を教えてあげた',  next: 'result' },
      { t: 'こっそり全部いただいた',     next: 'result' }
    ]
  },
  q4_hana_b: {
    story: '犬が教えてくれた枯れ木に、灰をまくと\nなんと大輪の花が満開に！\n殿様に大絶賛されました。\n\n隣のじいさんが「私もやる！」と言い出しました——',
    q: 'あなたはどうした？',
    opts: [
      { t: '「やめなさい！」と必死に止めた',  next: 'result' },
      { t: '「どうぞどうぞ」と笑って見ていた', next: 'result' }
    ]
  },

  /* ── おばあさんルート ── */
  q2b: {
    story: 'おばあさんは川へ洗濯に行きました。\nせっせと洗っていると、上流から\nドンブラコ、ドンブラコと何かが流れてきます——',
    q: '流れてきたのは何でしたか？',
    opts: [
      { t: '🍑 大きな桃（桃太郎の世界へ）',     next: 'q3_momo'  },
      { t: '🕊 傷ついた鶴（鶴の恩返しの世界へ）', next: 'q3_tsuru' }
    ]
  },

  /* 桃太郎 */
  q3_momo: {
    story: '桃を割ると、元気いっぱいの男の子が！\n「桃太郎」と名付けて育てました。\n\nあっという間に大きくなり、ある日こう言い出しました。\n「鬼ヶ島へ鬼退治に行きます！」',
    q: 'あなたはどうした？',
    opts: [
      { t: '🍡 キビダンゴを作って持たせた',      next: 'q4_momo_a' },
      { t: '「危ない！行かせません！」と止めた', next: 'q4_momo_b' }
    ]
  },
  q4_momo_a: {
    story: '桃太郎は犬・猿・キジを仲間にして旅立ちました。\n数ヶ月後、鬼を退治して凱旋！\n大量の金銀財宝を持ち帰ってきました——',
    q: 'あなたはどうした？',
    opts: [
      { t: 'ありがたく全部受け取った',            next: 'result' },
      { t: '「鬼のものはいりません！」と断った', next: 'result' }
    ]

function swapRandom(arr) {
  return Math.random() < 0.5 ? [...arr] : [arr[1], arr[0]];
}

function renderStep(key) {
  currentKey = key;
  const node = TREE[key];

  // 物語テキスト（直接表示）
  document.getElementById('story-text').textContent = node.story;
  document.getElementById('question-text').textContent = node.q;

  // A/Bをランダムに割り当て
  shuffled = swapRandom(node.opts);
  document.getElementById('textA').textContent = shuffled[0].t;
  document.getElementById('textB').textContent = shuffled[1].t;

  // カードをリセット
  revA = false; revB = false; selectedOpt = null;
  document.getElementById('cardA').className = 'card';
  document.getElementById('cardB').className = 'card';
  document.getElementById('ok-btn').style.display = 'none';

  // 進捗ドット
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'dot' + (i < stepNum ? ' done' : i === stepNum ? ' now' : '');
  }
}

function flipCard(side) {
  if (side === 'A' && !revA) {
    revA = true;
    document.getElementById('cardA').classList.add('opened');
  }
  if (side === 'B' && !revB) {
    revB = true;
    document.getElementById('cardB').classList.add('opened');
  }
  // 選択
  selectedOpt = (side === 'A') ? shuffled[0] : shuffled[1];
  document.getElementById('cardA').classList.toggle('selected', side === 'A');
  document.getElementById('cardB').classList.toggle('selected', side === 'B');

  const btn = document.getElementById('ok-btn');
  btn.style.display = 'block';
  btn.textContent = '「' + selectedOpt.t.replace(/^[🎋🌸🍑🕊🍡]\s*/u, '') + '」で決定！ →';
}

function confirmChoice() {
  pathLog.push(selectedOpt.t);
  stepNum++;

  if (selectedOpt.next === 'result') {
    showResult();
  } else {
    renderStep(selectedOpt.next);
  }
}

async function sendMessage() {
  if (isSending) return;
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;

  isSending = true;
  clearTimeout(silenceTimer);

  inp.value = '';
  inp.style.height = '';
  addMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  setMicStatus('送信中…');
  const loadId = addMessage('ai', '…', true);

  try {
    const reply = await callAI(chatHistory);
    chatHistory.push({ role: 'assistant', content: reply });
    updateMessage(loadId, reply);
  } catch(e) {
    console.error('API error:', e.message);
    updateMessage(loadId, '【エラー】' + e.message);
    const wasMicOn = micEnabled;
    micEnabled = false;
    if (recognition) { try { recognition.stop(); } catch(err) {} }
    await new Promise(r => setTimeout(r, 3000));
    if (wasMicOn && chatActive) {
      micEnabled = true;
      try { recognition.start(); } catch(err) {}
    }
  }

  btn.disabled = false;
  isSending = false;
  if (micEnabled) setMicStatus('（待機中）');
}

function addMessage(role, text, loading = false) {

  const div = document.createElement('div');
  div.id = id;

  if (role === 'ai') {

    const bub = document.createElement('div'); bub.className = 'msg-ai-bubble'; bub.textContent = text;
    div.appendChild(av); div.appendChild(bub);
  } else {
    div.className = 'msg-user';
    const bub = document.createElement('div'); bub.className = 'msg-user-bubble'; bub.textContent = text;
    div.appendChild(bub);

  container.appendChild(div);

/* =====================================================
   OpenAI APIを呼ぶ共通関数
   ===================================================== */
async function callAI(messages) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getApiKey()
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      max_tokens: 300,
      messages: [
        { role: 'system', content: buildSystemPrompt() },
        ...messages
      ]
    })
  });
  const data = await res.json();
  const reply = data?.choices?.[0]?.message?.content;
  if (!reply) throw new Error(data?.error?.message || 'no content');
  return reply;
}

async function saveLog() {
  const btn    = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  const entry  = buildLogEntry();

  if (!window.showSaveFilePicker) {
    // 非対応ブラウザ → ダウンロード
    fallbackDownload(entry);
    status.textContent = '記録をダウンロードしました。';
    return;
  }

  try {
    if (!logFileHandle) {
      // 初回のみ：新規ファイルを作成
      const now2 = new Date();
      const dateName = now2.getFullYear()
        + String(now2.getMonth()+1).padStart(2,'0')
        + String(now2.getDate()).padStart(2,'0')
        + '_'
        + String(now2.getHours()).padStart(2,'0')
        + String(now2.getMinutes()).padStart(2,'0')
        + '_あいちゃん記録.txt';
      status.textContent = '保存先のファイルを作成してください…';
      logFileHandle = await window.showSaveFilePicker({
        suggestedName: dateName,
        startIn: 'desktop',
        types: [{ description: 'テキストファイル', accept: { 'text/plain': ['.txt'] } }]
      });
    }

    // 既存内容を読んで末尾に追記（ファイル選択ダイアログなし）
    let existing = '';
    try {
      const file = await logFileHandle.getFile();
      existing = await file.text();
    } catch(e) {}

    const writable = await logFileHandle.createWritable();
    await writable.write(existing + entry);
    await writable.close();

    btn.textContent      = '✅ 記録しました';
    btn.style.background = '#4CAF50';
    status.textContent   = '📄 ' + logFileHandle.name + ' に追記しました';

  } catch(e) {
    if (e.name === 'AbortError') {
      status.textContent = 'キャンセルしました。';
      logFileHandle = null;
    } else {
      status.textContent = 'エラー：' + e.message;
      fallbackDownload(entry);
    }
  }
}

function fallbackDownload(text) {
  const now = chatEndTime || new Date();
  const fname = now.getFullYear()
    + String(now.getMonth()+1).padStart(2,'0')
    + String(now.getDate()).padStart(2,'0')
    + '_あいちゃん記録.txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
}

  const btn = document.getElementById('mic-btn');
  if (!SR) {
    if (btn) { btn.disabled = true; btn.title = 'Chrome / Edge が必要です'; }
    return;
  }

  function buildRecognition() {
    const r = new SR();
    r.lang           = 'ja-JP';
    r.continuous     = true;
    r.interimResults = false;   // ← 途中経過を非表示にする

    r.onstart = () => {
      isRecording = true;
      setMicStatus('🔴 聞いています… 話し終えると送ります');
      document.getElementById('mic-btn').classList.add('recording');
    };

    r.onresult = (e) => {
      if (isSending) return;   // ← 送信中は無視
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
      }
      if (!final.trim()) return;
      // テキストをセットしてタイマー（重複防止のため毎回クリア）
      clearTimeout(silenceTimer);
      document.getElementById('user-input').value = final;
      silenceTimer = setTimeout(() => {
        if (!isSending) sendMessage();
      }, 600);
    };

    r.onend = () => {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
      // 送信中でなければ自動再起動（許可は不要）
      if (chatActive && micEnabled && !isSending) {
        setMicStatus('（待機中）');
        setTimeout(() => {
          if (chatActive && micEnabled) {
            try { recognition.start(); } catch(err) {}
          }
        }, 400);
      } else {
        setMicStatus('');
      }
    };

    r.onerror = (e) => {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
      if (e.error === 'not-allowed') {
        micEnabled = false;
        setMicStatus('⚠️ マイクを許可してください');
        setTimeout(() => setMicStatus(''), 5000);
      }
      // no-speech はそのまま自動再起動に任せる
    };
    return r;
  }

  recognition = buildRecognition();
}

function startMicSession() {
  if (!recognition) return;
  chatActive = true;
  micEnabled = true;
  try { recognition.start(); } catch(e) {}
}

function stopMicSession() {
  chatActive = false;
  micEnabled = false;
  clearTimeout(silenceTimer);
  if (recognition) { try { recognition.stop(); } catch(e) {} }
  setMicStatus('');
}

function toggleMic() {
  if (!recognition) { alert('Chrome または Edge が必要です。'); return; }
  if (micEnabled) {
    micEnabled = false;
    clearTimeout(silenceTimer);
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    document.getElementById('mic-btn').title = 'マイクで話す';
    setMicStatus('マイクをオフにしました');
    setTimeout(() => setMicStatus(''), 2000);
  } else {
    micEnabled = true;
    document.getElementById('mic-btn').title = 'マイクをオフにする';
    try { recognition.start(); } catch(e) {}
  }
}

function setMicStatus(msg) {
  const el = document.getElementById('mic-status');
  if (el) el.textContent = msg;
}

initMic();

/* =====================================================
   パスワード認証
   ★★★ パスワードを変えるときはここを変えてください ★★★
   ===================================================== */
const PASSWORD = 'myaichan';

function checkPassword() {
  const input = document.getElementById('pw-input').value;
  if (input === PASSWORD) {
    document.getElementById('pw-screen').style.display = 'none';
    try {
      const key = getApiKey();
      if (key && key.length >= 20) {
        document.getElementById('key-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        renderStep('q1');
      } else {
        document.getElementById('key-screen').style.display = 'block';
      }
    } catch(e) {
      document.getElementById('key-screen').style.display = 'block';
    }
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
    document.getElementById('pw-input').value = '';
    setTimeout(() => {
      document.getElementById('pw-error').textContent = '';
    }, 2000);
  }
}

/* ========== 起動 ========== */
(function start() {
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
})();
